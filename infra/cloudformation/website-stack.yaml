AWSTemplateFormatVersion: "2010-09-09"
Description: "Fincora website static hosting (S3 private + CloudFront + OAC)"

Parameters:
  ProjectName:
    Type: String
    Default: fincora-website
  Environment:
    Type: String
    AllowedValues:
      - dev
      - stg
      - prd
    Default: dev
  PriceClass:
    Type: String
    AllowedValues:
      - PriceClass_100
      - PriceClass_200
      - PriceClass_All
    Default: PriceClass_100
  DomainName:
    Type: String
    Default: ""
    Description: "Optional custom domain for CloudFront alias (e.g. dev.fincora.io)"
  AcmCertificateArn:
    Type: String
    Default: ""
    Description: "Optional ACM certificate ARN (must be in us-east-1) when DomainName is set"
  WwwAliasDomain:
    Type: String
    Default: ""
    Description: >-
      Optional second hostname on the same distribution (e.g. www.fincora.io). Must be
      covered by the ACM certificate. Requests to this host get a 301 to https://DomainName
      with the same path and query string.

Rules:
  WwwAliasRequiresCustomDomain:
    RuleCondition: !Not [!Equals [!Ref WwwAliasDomain, ""]]
    Assertions:
      - AssertDescription: >-
          WwwAliasDomain requires DomainName and AcmCertificateArn (TLS aliases on the distribution).
        Assert: !And
          - !Not [!Equals [!Ref DomainName, ""]]
          - !Not [!Equals [!Ref AcmCertificateArn, ""]]

Conditions:
  UseCustomDomain: !Not [!Equals [!Ref DomainName, ""]]
  UseAcmCert: !Not [!Equals [!Ref AcmCertificateArn, ""]]
  UseAliases: !And
    - !Condition UseCustomDomain
    - !Condition UseAcmCert
  HasWwwAlias: !Not [!Equals [!Ref WwwAliasDomain, ""]]
  UseAliasesWithWww: !And
    - !Condition UseAliases
    - !Condition HasWwwAlias

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-${Environment}-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      VersioningConfiguration:
        Status: Suspended
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action:
              - s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}"

  SiteOac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${ProjectName}-${Environment}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WwwRedirectFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-www-apex"
      AutoPublish: true
      FunctionConfig:
        Comment: !Sub "301 ${WwwAliasDomain} -> https://${DomainName} (path + query)"
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        function buildQueryString(qs) {
            if (!qs) {
                return "";
            }
            var parts = [];
            for (var key in qs) {
                if (!Object.prototype.hasOwnProperty.call(qs, key)) {
                    continue;
                }
                var entry = qs[key];
                if (entry.multiValue) {
                    for (var i = 0; i < entry.multiValue.length; i++) {
                        parts.push(encodeURIComponent(key) + "=" + encodeURIComponent(entry.multiValue[i].value));
                    }
                } else if (entry.value !== undefined) {
                    parts.push(encodeURIComponent(key) + "=" + encodeURIComponent(entry.value));
                }
            }
            return parts.length ? "?" + parts.join("&") : "";
        }

        function handler(event) {
            var request = event.request;
            var wwwHost = "${WwwAliasDomain}";
            if (!wwwHost) {
                return request;
            }
            var hostHeader = request.headers.host;
            var host = hostHeader && hostHeader.value ? hostHeader.value : "";
            if (host !== wwwHost) {
                return request;
            }
            var apexBase = "https://${DomainName}";
            var location = apexBase + request.uri + buildQueryString(request.querystring);
            return {
                statusCode: 301,
                statusDescription: "Moved Permanently",
                headers: {
                    location: { value: location }
                }
            };
        }

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${ProjectName}-${Environment}"
        DefaultRootObject: index.html
        PriceClass: !Ref PriceClass
        HttpVersion: http2
        IPV6Enabled: true
        Origins:
          - Id: site-origin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            S3OriginConfig: {}
            OriginAccessControlId: !GetAtt SiteOac.Id
        DefaultCacheBehavior:
          TargetOriginId: site-origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt WwwRedirectFunction.FunctionMetadata.FunctionARN
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
        ViewerCertificate: !If
          - UseAliases
          - AcmCertificateArn: !Ref AcmCertificateArn
            MinimumProtocolVersion: TLSv1.2_2021
            SslSupportMethod: sni-only
          - CloudFrontDefaultCertificate: true
        Aliases: !If
          - UseAliases
          - !If
            - UseAliasesWithWww
            - - !Ref DomainName
              - !Ref WwwAliasDomain
            - - !Ref DomainName
          - !Ref AWS::NoValue

Outputs:
  WebsiteBucketName:
    Description: S3 bucket hosting static files
    Value: !Ref SiteBucket
  CloudFrontDistributionId:
    Description: CloudFront distribution ID
    Value: !Ref SiteDistribution
  CloudFrontDomainName:
    Description: CloudFront domain name
    Value: !GetAtt SiteDistribution.DomainName
